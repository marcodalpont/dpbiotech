<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Med Connect — Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:       #FF3B30;
      --red-soft:  rgba(255, 59, 48, 0.15);
      --bg:        #000000;
      --surface:   rgba(28, 28, 30, 0.92);
      --surface2:  rgba(44, 44, 46, 0.85);
      --border:    rgba(255, 255, 255, 0.10);
      --border2:   rgba(255, 255, 255, 0.06);
      --text:      #FFFFFF;
      --text-sec:  rgba(255, 255, 255, 0.60);
      --text-ter:  rgba(255, 255, 255, 0.35);
      --blur:      blur(24px) saturate(1.8);
      --blur-sm:   blur(12px) saturate(1.6);
      --radius:    14px;
      --radius-sm: 10px;
      --radius-xs: 8px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Inter', BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── LOADING / ERROR SCREENS ── */
    #screen-loading,
    #screen-error,
    #screen-ended {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; z-index: 100;
      background: var(--bg);
    }
    #screen-error, #screen-ended { display: none; }

    /* Apple SF symbol-like spinner */
    .apple-spinner {
      width: 40px; height: 40px;
      position: relative;
    }
    .apple-spinner::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2.5px solid transparent;
      border-top-color: var(--red);
      border-right-color: rgba(255,59,48,0.4);
      animation: spin 0.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .dot-live {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
      animation: blink 1.6s ease-in-out infinite;
    }
    @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

    .status-text {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-ter);
      letter-spacing: 0.02em;
    }

    /* Error / Ended cards */
    .state-card {
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      padding: 32px 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      max-width: 300px;
      width: 90vw;
      text-align: center;
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
    }
    .state-icon {
      font-size: 36px;
      margin-bottom: 4px;
    }
    .state-title {
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .state-msg {
      font-size: 13px;
      color: var(--text-sec);
      line-height: 1.55;
    }

    /* ── MAIN LAYOUT ── */
    #screen-live {
      display: none;
      position: fixed; inset: 0;
      flex-direction: column;
    }
    #screen-live.visible { display: flex; }

    /* Video fills everything */
    #videoWrap {
      position: relative;
      flex: 1;
      background: #000;
      overflow: hidden;
      min-height: 0;
    }
    video {
      width: 100%; height: 100%;
      object-fit: contain;
      display: block;
    }
    #overlayCanvas {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    /* ── LIVE BADGE ── */
    #liveBadge {
      position: absolute;
      top: 16px; left: 16px;
      display: flex; align-items: center; gap: 6px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: var(--blur-sm);
      -webkit-backdrop-filter: var(--blur-sm);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 5px 11px 5px 9px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fff;
    }

    /* ── BOTTOM BAR ── */
    #bar {
      height: 64px;
      background: var(--surface);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-top: 0.5px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      gap: 10px;
      flex-shrink: 0;
    }

    .bar-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: none;
      background: var(--surface2);
      color: #fff; font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .bar-btn:active { transform: scale(0.93); }
    .bar-btn:hover  { background: rgba(72, 72, 74, 0.9); }

    #muteBtn.muted {
      background: rgba(255, 59, 48, 0.18);
      color: var(--red);
    }

    #barLabel {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-sec);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: -0.01em;
    }
    #barLabel strong {
      color: var(--text);
      font-weight: 500;
    }

    /* ── CHAT PANEL ── */
    #chatPanel {
      position: absolute;
      bottom: 64px; right: 0;
      width: min(320px, 100vw);
      height: min(360px, 52vh);
      background: var(--surface);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-top: 0.5px solid var(--border);
      border-left: 0.5px solid var(--border);
      border-top-left-radius: var(--radius);
      display: flex; flex-direction: column;
      transform: translateY(calc(100% + 1px));
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    #chatPanel.open { transform: translateY(0); }

    #chatHeader {
      padding: 12px 16px 10px;
      border-bottom: 0.5px solid var(--border2);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sec);
      letter-spacing: 0.01em;
      flex-shrink: 0;
    }

    #chatMessages {
      flex: 1; overflow-y: auto;
      padding: 10px 14px;
      display: flex; flex-direction: column; gap: 6px;
      overscroll-behavior: contain;
    }
    #chatMessages::-webkit-scrollbar { width: 2px; }
    #chatMessages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .chat-msg {
      font-size: 13px; line-height: 1.5;
    }
    .chat-msg .name {
      font-weight: 600;
      color: var(--text);
      margin-right: 4px;
    }
    .chat-msg .body { color: var(--text-sec); }

    #chatInputRow {
      display: flex; gap: 8px;
      padding: 10px 12px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      border-top: 0.5px solid var(--border2);
      flex-shrink: 0;
    }
    #chatInput {
      flex: 1;
      background: rgba(255, 255, 255, 0.07);
      border: 0.5px solid var(--border);
      border-radius: 20px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      padding: 8px 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    #chatInput::placeholder { color: var(--text-ter); }
    #chatInput:focus { border-color: rgba(255, 255, 255, 0.22); }

    #chatSend {
      background: var(--red);
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 15px;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      align-self: flex-end;
      transition: opacity 0.15s, transform 0.1s;
    }
    #chatSend:hover  { opacity: 0.88; }
    #chatSend:active { transform: scale(0.92); }

    /* ── NAME PROMPT ── */
    #namePrompt {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex; align-items: flex-end;
      justify-content: center;
      z-index: 200;
      padding: 0 0 env(safe-area-inset-bottom, 0px);
    }

    @media (min-height: 500px) {
      #namePrompt { align-items: center; }
    }

    #nameCard {
      background: var(--surface);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 0.5px solid var(--border);
      border-radius: 20px 20px 20px 20px;
      padding: 28px 22px 28px;
      width: min(380px, 100vw);
      display: flex; flex-direction: column; gap: 18px;
      animation: sheet-up 0.35s cubic-bezier(0.34, 1.2, 0.64, 1) both;
    }
    @keyframes sheet-up {
      from { transform: translateY(32px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    #nameCard-header { display: flex; flex-direction: column; gap: 5px; }
    #nameCard h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    #nameCard p {
      font-size: 14px;
      color: var(--text-sec);
      line-height: 1.5;
    }

    #nameField {
      background: rgba(255, 255, 255, 0.07);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 16px;
      padding: 13px 14px;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }
    #nameField::placeholder { color: var(--text-ter); }
    #nameField:focus { border-color: rgba(255, 255, 255, 0.28); }

    #joinBtn {
      background: var(--red);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 14px;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: -0.01em;
      transition: opacity 0.15s, transform 0.1s;
    }
    #joinBtn:hover  { opacity: 0.88; }
    #joinBtn:active { transform: scale(0.98); }
  </style>
</head>
<body>

<!-- Name Prompt -->
<div id="namePrompt">
  <div id="nameCard">
    <div id="nameCard-header">
      <h2>Join Live</h2>
      <p>Enter your name so the streamer knows who's watching.</p>
    </div>
    <input id="nameField" type="text" placeholder="Your name" maxlength="40" autocomplete="off" />
    <button id="joinBtn">Join Stream</button>
  </div>
</div>

<!-- Loading -->
<div id="screen-loading">
  <div class="apple-spinner"></div>
  <p class="status-text" id="loadingText">Connecting…</p>
</div>

<!-- Error -->
<div id="screen-error">
  <div class="state-card">
    <div class="state-icon">📡</div>
    <p class="state-title">Stream Not Found</p>
    <p class="state-msg" id="errorMsg">This stream may have ended or the link is invalid.</p>
  </div>
</div>

<!-- Ended -->
<div id="screen-ended">
  <div class="state-card">
    <div class="state-icon">🎬</div>
    <p class="state-title">Stream Ended</p>
    <p class="state-msg">The streamer has ended this live session.</p>
  </div>
</div>

<!-- Live screen -->
<div id="screen-live">
  <div id="videoWrap">
    <video id="remoteVideo" autoplay playsinline muted></video>
    <canvas id="overlayCanvas"></canvas>

    <div id="liveBadge">
      <div class="dot-live"></div>
      LIVE
    </div>

    <div id="chatPanel">
      <div id="chatHeader">Chat</div>
      <div id="chatMessages"></div>
      <div id="chatInputRow">
        <input id="chatInput" type="text" placeholder="Message…" maxlength="200" />
        <button id="chatSend">↑</button>
      </div>
    </div>
  </div>

  <div id="bar">
    <button id="muteBtn" class="bar-btn" title="Toggle mic">🎙</button>
    <div id="barLabel">Watching <strong id="streamerLabel">live stream</strong></div>
    <button id="chatToggle" class="bar-btn" title="Chat">💬</button>
  </div>
</div>

<!-- Firebase + PeerJS -->
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script type="module">
import { initializeApp }  from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
import { getDatabase, ref, set, get, onValue, off, push } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

// ─── CONFIG ────────────────────────────────────────────────────────────────
const firebaseConfig = {
  apiKey: "AIzaSyAPZC_sUOYnwJdW3SG6uEoRKSDVXfcqjdg",
  authDomain: "flutter-webview-e59a8.firebaseapp.com",
  databaseURL: "https://flutter-webview-e59a8-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "flutter-webview-e59a8",
  storageBucket: "flutter-webview-e59a8.appspot.com",
  messagingSenderId: "766286969529",
  appId: "1:766286969529:web:157fb453400467bd853968"
};
// ───────────────────────────────────────────────────────────────────────────

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

const params  = new URLSearchParams(location.search);
const roomId  = params.get("uid");

if (!roomId) {
  showError("No stream ID in link. Please ask the streamer for a valid link.");
}

// ── DOM refs ──────────────────────────────────────────────────────────────
const namePrompt    = document.getElementById("namePrompt");
const nameField     = document.getElementById("nameField");
const joinBtn       = document.getElementById("joinBtn");
const screenLoading = document.getElementById("screen-loading");
const screenError   = document.getElementById("screen-error");
const screenEnded   = document.getElementById("screen-ended");
const screenLive    = document.getElementById("screen-live");
const loadingText   = document.getElementById("loadingText");
const remoteVideo   = document.getElementById("remoteVideo");
const overlayCanvas = document.getElementById("overlayCanvas");
const ctx           = overlayCanvas.getContext("2d");
const muteBtn       = document.getElementById("muteBtn");
const chatToggle    = document.getElementById("chatToggle");
const chatPanel     = document.getElementById("chatPanel");
const chatMessages  = document.getElementById("chatMessages");
const chatInput     = document.getElementById("chatInput");
const chatSend      = document.getElementById("chatSend");
const streamerLabel = document.getElementById("streamerLabel");

// ── Offscreen canvas for double-buffering ─────────────────────────────────
const offscreen = document.createElement("canvas");
const offCtx    = offscreen.getContext("2d");

// ── State ─────────────────────────────────────────────────────────────────
let viewerName = "Guest";
let myPeerId   = null;
let localStream = null;
let isMuted    = true;
let chatOpen   = false;

// ── Canvas resize ─────────────────────────────────────────────────────────
function resizeCanvas() {
  overlayCanvas.width  = overlayCanvas.offsetWidth;
  overlayCanvas.height = overlayCanvas.offsetHeight;
  offscreen.width  = overlayCanvas.width;
  offscreen.height = overlayCanvas.height;
  if (window.__latestOverlays && window.__latestOverlays.length) {
    renderOverlays(window.__latestOverlays);
  }
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

// ── Helpers ───────────────────────────────────────────────────────────────
function showError(msg) {
  screenLoading.style.display = "none";
  namePrompt.style.display    = "none";
  screenError.style.display   = "flex";
  document.getElementById("errorMsg").textContent = msg || "Stream not found.";
}

function showEnded() {
  screenLive.classList.remove("visible");
  screenLoading.style.display = "none";
  screenEnded.style.display   = "flex";
}

function setLoadingText(t) { loadingText.textContent = t; }

// ── Name prompt ───────────────────────────────────────────────────────────
nameField.focus();
nameField.addEventListener("keydown", e => { if (e.key === "Enter") startJoin(); });
joinBtn.addEventListener("click", startJoin);

function startJoin() {
  const v = nameField.value.trim();
  if (!v) { nameField.focus(); return; }
  viewerName = v;
  namePrompt.style.display = "none";
  screenLoading.style.display = "flex";
  setLoadingText("Checking stream…");
  checkStreamThenConnect();
}

// ── Check Firebase that stream is live ────────────────────────────────────
async function checkStreamThenConnect() {
  if (!roomId) return;
  try {
    const snap = await get(ref(db, `streams/${roomId}`));
    if (!snap.exists()) {
      showError("This stream isn't live right now. The link may have expired.");
      return;
    }
    const nameSnap = await get(ref(db, `users/${roomId}/name`));
    if (nameSnap.exists()) {
      const n = nameSnap.val();
      if (n) streamerLabel.textContent = n;
    }
    setLoadingText("Joining…");
    initPeer();
  } catch(e) {
    showError("Could not reach the server. Check your connection.");
  }
}

// ── PeerJS viewer logic ───────────────────────────────────────────────────
function initPeer() {
  const randomId = "web-" + Math.random().toString(36).slice(2, 10);
  myPeerId = randomId;

  const peer = new Peer(randomId, {
    debug: 0,
    config: {
      iceServers: [
        {
          urls: "turn:relay1.expressturn.com:3478",
          username: "efEMJJ29G402WRU4RM",
          credential: "OdRMwByZ9vXjnJ8b",
        }
      ]
    }
  });

  peer.on("open", async () => {
    set(ref(db, `rooms/${roomId}/viewers/${randomId}`), { name: viewerName });
    set(ref(db, `users/${randomId}/name`), viewerName);

    setLoadingText("Getting mic…");

    try {
      const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      localStream = audioStream;

      const dummyCanvas = document.createElement("canvas");
      dummyCanvas.width = 1; dummyCanvas.height = 1;
      const dummyVideoTrack = dummyCanvas.captureStream().getVideoTracks()[0];
      const dummyStream = new MediaStream([...audioStream.getAudioTracks(), dummyVideoTrack]);

      audioStream.getAudioTracks().forEach(t => t.enabled = false);

      setLoadingText("Dialing streamer…");
      const call = peer.call(roomId, dummyStream);

      attachDataChannel(call);

      call.on("stream", stream => {
        setLoadingText("Starting…");
        remoteVideo.srcObject = stream;
        remoteVideo.muted = false;
        remoteVideo.play().catch(() => { remoteVideo.muted = true; remoteVideo.play(); });
        screenLoading.style.display = "none";
        screenLive.classList.add("visible");
        resizeCanvas();
      });

      call.on("error", () => showError("Connection failed. The stream may have ended."));
      call.on("close",  () => showEnded());

    } catch(err) {
      console.warn("Mic denied, joining silently:", err);
      const silentStream = createSilentStream();
      setLoadingText("Dialing streamer…");
      const call = peer.call(roomId, silentStream);
      attachDataChannel(call);
      call.on("stream", stream => {
        remoteVideo.srcObject = stream;
        remoteVideo.muted = false;
        remoteVideo.play().catch(() => { remoteVideo.muted = true; remoteVideo.play(); });
        screenLoading.style.display = "none";
        screenLive.classList.add("visible");
        resizeCanvas();
      });
      call.on("close", () => showEnded());
    }
  });

  peer.on("error", err => {
    if (err.type === "peer-unavailable") {
      showError("Streamer is not reachable. The live may have ended.");
    } else {
      showError("Connection error: " + err.message);
    }
  });

  onValue(ref(db, `streams/${roomId}`), snap => {
    if (!snap.exists() && screenLive.classList.contains("visible")) {
      showEnded();
    }
  });
}

function createSilentStream() {
  const actx  = new AudioContext();
  const dest   = actx.createMediaStreamDestination();
  const dummy  = document.createElement("canvas");
  dummy.width  = 1; dummy.height = 1;
  const vTrack = dummy.captureStream().getVideoTracks()[0];
  return new MediaStream([dest.stream.getAudioTracks()[0], vTrack]);
}

// ── Overlay coordinate helpers ────────────────────────────────────────────
function aspectFitRect(bw, bh, contentAR) {
  const boxAR = bw / bh;
  let w, h;
  if (contentAR >= boxAR) { w = bw; h = bw / contentAR; }
  else                     { h = bh; w = bh * contentAR; }
  return { x: (bw - w) / 2, y: (bh - h) / 2, w, h };
}

function overlayToCanvas(nx, ny, canvasW, canvasH, videoAR, containerAR, cameraAR) {
  let camRect;
  if (containerAR && cameraAR) {
    const relW = cameraAR / containerAR;
    if (relW <= 1) {
      camRect = { x: (1 - relW) / 2, y: 0, w: relW, h: 1 };
    } else {
      const relH = 1 / relW;
      camRect = { x: 0, y: (1 - relH) / 2, w: 1, h: relH };
    }
  } else {
    camRect = { x: 0, y: 0, w: 1, h: 1 };
  }

  const cx = (nx - camRect.x) / camRect.w;
  const cy = (ny - camRect.y) / camRect.h;

  const vRect = aspectFitRect(canvasW, canvasH, videoAR);
  return { x: vRect.x + cx * vRect.w, y: vRect.y + cy * vRect.h };
}

// ── Overlay rendering ─────────────────────────────────────────────────────
const imgCache    = {};
const imgLoading  = {};
const imgLastGood = {};

window.__latestOverlays = [];
window.__latestVideoAR  = 16 / 9;

function renderOverlays(overlays) {
  if (!Array.isArray(overlays)) return;
  window.__latestOverlays = overlays;

  const videoAR     = window.__latestVideoAR     || (16 / 9);
  const containerAR = window.__latestContainerAR || null;
  const cameraAR    = window.__latestCameraAR    || null;
  const cw = offscreen.width, ch = offscreen.height;

  const vRect = aspectFitRect(cw, ch, videoAR);

  offCtx.clearRect(0, 0, cw, ch);

  overlays.forEach((o, i) => {

    if (o.type === "pointer") {
      const pt = overlayToCanvas(o.x, o.y, cw, ch, videoAR, containerAR, cameraAR);
      offCtx.beginPath();
      offCtx.arc(pt.x, pt.y, 14, 0, 2 * Math.PI);
      offCtx.fillStyle = "rgba(255,59,48,0.9)";
      offCtx.fill();

    } else if (o.type === "image" && o.base64) {
      const key      = o.id || (o.base64.slice(0, 32) + o.base64.slice(-32));
      const stableId = o.id || "ov_" + i;

      if (imgCache[key]) {
        imgLastGood[stableId] = imgCache[key];
        drawImage(offCtx, imgCache[key], o, cw, ch, videoAR, containerAR, cameraAR);
      } else {
        if (imgLastGood[stableId]) {
          drawImage(offCtx, imgLastGood[stableId], o, cw, ch, videoAR, containerAR, cameraAR);
        }
        if (!imgLoading[key]) {
          const img = new Image();
          imgLoading[key] = img;
          img.onload = () => {
            imgCache[key] = img;
            delete imgLoading[key];
            renderOverlays(window.__latestOverlays || []);
          };
          img.src = o.base64;
        }
      }

    } else if (o.type === "drawing" && o.base64) {
      const img = new Image();
      img.onload = () => {
        offCtx.drawImage(img, vRect.x, vRect.y, vRect.w, vRect.h);
        ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        ctx.drawImage(offscreen, 0, 0);
      };
      img.src = o.base64;
      return;
    }
  });

  ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  ctx.drawImage(offscreen, 0, 0);
}

function drawImage(targetCtx, img, o, cw, ch, videoAR, containerAR, cameraAR) {
  const tl = overlayToCanvas(o.x,           o.y,            cw, ch, videoAR, containerAR, cameraAR);
  const br = overlayToCanvas(o.x + o.width, o.y + o.height, cw, ch, videoAR, containerAR, cameraAR);
  const bx = tl.x, by = tl.y;
  const bw = br.x - tl.x, bh = br.y - tl.y;
  const angle = o.rotation || 0;

  const sin   = Math.abs(Math.sin(angle));
  const cos   = Math.abs(Math.cos(angle));
  const rotW  = img.width  * cos + img.height * sin;
  const rotH  = img.width  * sin + img.height * cos;
  const scale = Math.min(bw / rotW, bh / rotH);
  const dw    = img.width  * scale;
  const dh    = img.height * scale;

  const radius = 12;
  targetCtx.save();
  targetCtx.translate(bx + bw / 2, by + bh / 2);
  targetCtx.rotate(angle);
  targetCtx.beginPath();
  if (targetCtx.roundRect) {
    targetCtx.roundRect(-dw / 2, -dh / 2, dw, dh, radius);
  } else {
    targetCtx.rect(-dw / 2, -dh / 2, dw, dh);
  }
  targetCtx.clip();
  targetCtx.drawImage(img, -dw / 2, -dh / 2, dw, dh);
  targetCtx.restore();
}

// ── Data channel ──────────────────────────────────────────────────────────
function attachDataChannel(call) {
  const tryAttach = () => {
    if (!call.peerConnection) { setTimeout(tryAttach, 50); return; }
    call.peerConnection.ondatachannel = e => {
      const dc = e.channel;
      dc.onmessage = ev => {
        try {
          const packet = JSON.parse(ev.data);
          const overlays     = Array.isArray(packet) ? packet : (packet.overlays || []);
          window.__latestVideoAR    = Array.isArray(packet) ? (16 / 9) : (packet.videoAR    || (16 / 9));
          window.__latestContainerAR = Array.isArray(packet) ? null      : (packet.containerAR || null);
          window.__latestCameraAR    = Array.isArray(packet) ? null      : (packet.cameraAR    || null);
          renderOverlays(overlays);
        } catch(_) {}
      };
    };
  };
  tryAttach();
}

// ── Mute toggle ───────────────────────────────────────────────────────────
muteBtn.addEventListener("click", () => {
  isMuted = !isMuted;
  if (localStream) localStream.getAudioTracks().forEach(t => t.enabled = !isMuted);
  muteBtn.textContent = isMuted ? "🎙" : "🔊";
  muteBtn.classList.toggle("muted", isMuted);
});

// ── Chat ──────────────────────────────────────────────────────────────────
chatToggle.addEventListener("click", () => {
  chatOpen = !chatOpen;
  chatPanel.classList.toggle("open", chatOpen);
  chatToggle.classList.toggle("active", chatOpen);
  if (chatOpen) chatInput.focus();
});

function sendChat() {
  const text = chatInput.value.trim();
  if (!text || !roomId) return;
  chatInput.value = "";
  push(ref(db, `streams/${roomId}/chat`), { name: viewerName, text });
}
chatSend.addEventListener("click", sendChat);
chatInput.addEventListener("keydown", e => { if (e.key === "Enter") sendChat(); });

if (roomId) {
  onValue(ref(db, `streams/${roomId}/chat`), snap => {
    chatMessages.innerHTML = "";
    snap.forEach(child => {
      const { name, text } = child.val() || {};
      if (!name || !text) return;
      const el = document.createElement("div");
      el.className = "chat-msg";
      el.innerHTML = `<span class="name">${escHtml(name)}</span><span class="body">${escHtml(text)}</span>`;
      chatMessages.appendChild(el);
    });
    chatMessages.scrollTop = chatMessages.scrollHeight;
  });
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
