<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png?v=2">
<link rel="apple-touch-icon" href="favicon-192.png?v=2"><title>Restricted Access — DP Biotech</title>
<script src="gate.js" data-login></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Colour variables from the rest of the site */
  :root { 
    --bg:#ffffff; 
    --text:#0a0a0a; 
    --muted:#525252; 
    --line:#e5e5e5; 
    --card:#ffffff; 
    --band-bg: #f3f4f6;
    --b1:#4f46e5; 
  }
  @media (prefers-color-scheme: dark){ 
    :root { 
      --bg:#0a0a0a; 
      --text:#fafafa; 
      --muted:#a1a1aa; 
      --line:#262626;
      --card:#18181b; 
      --band-bg: #111111;
    } 
  }
  
  /* Login page styles */
  body {
    margin: 0;
    font-family: Inter, system-ui, -apple-system, sans-serif;
    background: var(--band-bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .login-card {
    background: var(--card);
    padding: 40px;
    border-radius: 24px;
    border: 1px solid var(--line);
    box-shadow: 0 20px 60px rgba(0,0,0,.1);
    text-align: center;
    max-width: 360px;
    width: 90%;
  }
  .logo {
    height: 60px;
    border-radius: 50%;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 8px 0;
  }
  p {
    color: var(--muted);
    margin: 0 0 24px 0;
    font-size: 15px;
  }
  .input-field {
    width: 100%;
    box-sizing: border-box;
    padding: 12px 16px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--band-bg);
    color: var(--text);
    margin-bottom: 16px;
  }
  .btn {
    width: 100%;
    padding: 12px 16px;
    border-radius: 8px;
    border: none;
    background: var(--b1);
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .2s ease;
  }
  .btn:hover {
    opacity: 0.9;
  }
  .error-message {
    color: #ef4444;
    font-size: 14px;
    margin-top: 12px;
    display: none; /* hidden until needed */
  }
</style>
</head>
<body>

  <div class="login-card">
    <img src="logo.png" alt="DP Biotech Logo" class="logo">
    <h1>Restricted Access</h1>
    <p>This website is still being developed. Enter password to continue</p>
    
    <div id="login-box" role="form" aria-labelledby="login-title">
      <input
        id="access-key"
        class="input-field"
        type="text"
        placeholder="Enter"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Enter"
        style="-webkit-text-security: disc;"
        required
      >

      <button id="login-btn" type="button" class="btn">Login</button>
      <p id="error-message" class="error-message">Incorrect password.</p>
    </div>
  </div>

<script>
  // The passwords are not here: gate.js only knows their fingerprints (PBKDF2 + SHA-256).
  // To change them, see the comment at the top of gate.js.
  const loginBtn = document.getElementById('login-btn');
  const input = document.getElementById('access-key');
  const errorMessage = document.getElementById('error-message');

  // the page that was being opened, if it is a page of this site (a root page, or one in old/)
  function nextFile() {
    const n = new URLSearchParams(location.search).get('next') || '';
    const ok = /^(old\/)?[A-Za-z0-9_-]+(\.html)?([?#].*)?$/.test(n) && !/^(old\/)?login(\.html)?([?#]|$)/.test(n);
    return ok ? n.replace(/^old\//, '') : '';
  }
  // each password opens its own version of the site: go to that page in that version

  function showError(text) {
    errorMessage.textContent = text;
    errorMessage.style.display = 'block';
  }

  // the form is always shown, even to a browser that already has a password, so it can switch version
  if (!dpbGate.available) showError('Open the site over https to log in.');

  async function doLogin() {
    const entered = input.value;
    if (!entered || loginBtn.disabled) return;
    // Empty the field straight away so password managers don't try to save it.
    input.value = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Checking…';
    errorMessage.style.display = 'none';
    const version = await dpbGate.login(entered);
    if (version) {
      location.replace(dpbGate.pageIn(version, nextFile()));
      return;
    }
    loginBtn.disabled = false;
    loginBtn.textContent = 'Login';
    showError('Incorrect password.');
    input.focus();
  }

  loginBtn.addEventListener('click', doLogin);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
  });
</script>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
</body>
</html>
